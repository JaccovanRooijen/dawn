<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Morning Ritual</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap');

  :root {
    --bg-page: #09090b;
    --bg: #101012;
    --panel: #17171a;
    --tile: #1c1c1f;
    --line: #232327;
    --line-soft: #1c1c20;
    --text: #f2f0ea;
    --muted: #8f8b83;
    --faint: #57544e;
    --accent: #d9863c;
    --accent-deep: #b96f2d;
    --on-accent: #1c1206;
    --accent-dim: rgba(217, 134, 60, 0.13);
    --danger: #c05555;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: var(--bg-page);
    font-family: 'Outfit', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 24px 12px;
    -webkit-font-smoothing: antialiased;
  }

  svg { display: block; }

  .phone {
    width: 100%;
    max-width: 430px;
    background: var(--bg);
    border-radius: 40px;
    border: 1px solid #1b1b1f;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), 0 30px 80px rgba(0,0,0,0.55);
    padding: 34px 26px 116px;
    position: relative;
    min-height: 820px;
    overflow: hidden;
  }

  .glow {
    position: absolute;
    top: -140px; right: -60px;
    width: 360px; height: 360px;
    background: radial-gradient(circle, rgba(217,134,60,0.10) 0%, transparent 68%);
    pointer-events: none;
  }

  /* ---------- Header ---------- */
  header { position: relative; z-index: 1; }

  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
  }

  .avatar {
    width: 46px; height: 46px;
    border-radius: 50%;
    background: var(--tile);
    border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    color: var(--accent);
    position: relative;
  }
  .avatar::after {
    content: '';
    position: absolute;
    right: 0; bottom: 1px;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--bg);
    animation: breathe 2.8s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(0.78); opacity: 0.65; }
  }

  .streak-chip {
    display: flex;
    align-items: center;
    gap: 7px;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 9px 16px 9px 13px;
    font-size: 13.5px;
    color: var(--muted);
  }
  .streak-chip svg { color: var(--accent); }
  .streak-chip b {
    color: var(--text);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  h1 {
    font-size: 32px;
    font-weight: 300;
    letter-spacing: -0.02em;
    line-height: 1.12;
  }
  h1 strong { font-weight: 600; }

  .date-line {
    color: var(--muted);
    font-size: 14.5px;
    font-weight: 300;
    letter-spacing: 0.01em;
    margin: 6px 0 30px;
  }

  /* ---------- Stats band (no card — hairlines) ---------- */
  .stats {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 22px 2px;
    border-top: 1px solid var(--line-soft);
    border-bottom: 1px solid var(--line-soft);
    margin-bottom: 28px;
  }

  .ring { width: 84px; height: 84px; flex-shrink: 0; position: relative; }
  .ring > svg { transform: rotate(-90deg); }
  .ring .track { stroke: #222225; }
  .ring .fill {
    stroke: var(--accent);
    stroke-linecap: round;
    transition: stroke-dashoffset 0.8s var(--ease-out);
  }
  .ring .pct {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .stat-cols {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px 18px;
  }
  .stat .num {
    font-size: 19px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }
  .stat .num em { font-style: normal; color: var(--faint); font-weight: 400; }
  .stat .lbl {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--faint);
    margin-top: 3px;
    font-weight: 400;
  }
  .stat.wide { grid-column: 1 / -1; }
  .stat.wide .num { color: var(--accent); }

  /* ---------- Complete banner ---------- */
  .complete-banner {
    display: none;
    align-items: center;
    gap: 16px;
    background: linear-gradient(120deg, rgba(217,134,60,0.16), rgba(217,134,60,0.06) 65%);
    border: 1px solid rgba(217,134,60,0.32);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
    border-radius: 22px;
    padding: 18px 20px;
    margin-bottom: 28px;
    position: relative;
    overflow: hidden;
  }
  .complete-banner.show {
    display: flex;
    animation: banner-pop 0.55s var(--ease-out);
  }
  @keyframes banner-pop {
    0% { transform: scale(0.94) translateY(10px); opacity: 0; }
    60% { transform: scale(1.015) translateY(-1px); opacity: 1; }
    100% { transform: none; }
  }
  .complete-banner::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,0.055) 50%, transparent 70%);
    background-size: 250% 100%;
    animation: shimmer 3.2s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes shimmer {
    0% { background-position: 120% 0; }
    100% { background-position: -130% 0; }
  }
  .complete-icon {
    width: 46px; height: 46px;
    flex-shrink: 0;
    border-radius: 15px;
    background: var(--accent);
    color: var(--on-accent);
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.25);
  }
  .complete-banner h4 {
    font-size: 16.5px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin-bottom: 3px;
  }
  .complete-banner p {
    font-size: 13px;
    font-weight: 300;
    color: var(--muted);
    line-height: 1.5;
  }
  .complete-banner p b { color: var(--accent); font-weight: 500; }

  /* one-shot particle burst */
  .spark {
    position: absolute;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    pointer-events: none;
    animation: spark-fly 0.8s var(--ease-out) forwards;
  }
  @keyframes spark-fly {
    0% { transform: translate(0, 0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0.2); opacity: 0; }
  }

  .ring .pct.full { color: var(--accent); }

  /* ---------- Section ---------- */
  .section-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }
  .section-row h2 {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .section-row .count {
    color: var(--faint);
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- Activity list (divided rows, not cards) ---------- */
  .activity {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 17px 2px;
    border-bottom: 1px solid var(--line-soft);
    transition: opacity 0.35s var(--ease-out);
  }
  .activity:last-child { border-bottom: none; }

  .list.animate-in .activity {
    animation: rise-in 0.55s var(--ease-out) both;
    animation-delay: calc(var(--i) * 70ms);
  }
  @keyframes rise-in {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: none; }
  }

  .act-icon {
    width: 46px; height: 46px;
    flex-shrink: 0;
    border-radius: 15px;
    background: var(--tile);
    border: 1px solid var(--line-soft);
    display: flex; align-items: center; justify-content: center;
    color: var(--muted);
    transition: background 0.3s, color 0.3s;
  }
  .activity.done .act-icon { background: var(--accent-dim); color: var(--accent); border-color: transparent; }

  .act-body { flex: 1; min-width: 0; }
  .act-name {
    font-size: 16px;
    font-weight: 500;
    letter-spacing: -0.01em;
    margin-bottom: 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: color 0.3s;
  }
  .activity.done .act-name { color: var(--faint); }

  .act-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 12px;
    color: var(--muted);
  }
  .streak-tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    color: var(--accent);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .streak-tag.zero { color: var(--faint); }

  .dots { display: inline-flex; gap: 5px; }
  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #29292d;
    transition: background 0.3s;
  }
  .dot.hit { background: var(--accent); }
  .dot.today-dot { box-shadow: 0 0 0 1px var(--faint); }
  .dot.today-dot.hit { box-shadow: none; }

  .act-actions { display: flex; align-items: center; gap: 6px; }

  .icon-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--faint);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: color 0.25s, background 0.25s, transform 0.15s;
  }
  .icon-btn:hover { color: var(--text); background: var(--tile); }
  .icon-btn:active { transform: scale(0.9); }

  .check-btn {
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 1.5px solid var(--line);
    background: transparent;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: transparent;
    transition: all 0.3s var(--ease-out);
  }
  .check-btn:hover { border-color: var(--accent); }
  .check-btn:active { transform: scale(0.88); }
  .activity.done .check-btn {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--on-accent);
    animation: pop 0.35s var(--ease-out);
  }
  @keyframes pop {
    0% { transform: scale(0.82); }
    60% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }

  /* ---------- Empty state ---------- */
  .empty {
    text-align: left;
    padding: 44px 8px;
    border-bottom: 1px solid var(--line-soft);
  }
  .empty .empty-icon {
    width: 52px; height: 52px;
    border-radius: 17px;
    background: var(--tile);
    display: flex; align-items: center; justify-content: center;
    color: var(--accent);
    margin-bottom: 18px;
  }
  .empty h4 { font-size: 17px; font-weight: 500; margin-bottom: 6px; }
  .empty p { color: var(--muted); font-size: 14px; font-weight: 300; line-height: 1.55; max-width: 30ch; }

  /* ---------- CTA ---------- */
  .cta {
    position: absolute;
    left: 26px; right: 26px; bottom: 30px;
    background: var(--accent);
    color: var(--on-accent);
    border: none;
    border-radius: 999px;
    padding: 17px;
    font-size: 16px;
    font-weight: 600;
    font-family: inherit;
    letter-spacing: 0.01em;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 9px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), 0 12px 28px -10px rgba(217,134,60,0.45);
    transition: transform 0.15s var(--ease-out), filter 0.2s;
  }
  .cta:hover { filter: brightness(1.06); }
  .cta:active { transform: translateY(1px) scale(0.985); }

  /* ---------- Sheet ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(5,5,6,0.66);
    backdrop-filter: blur(5px);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 10;
  }
  .overlay.open { display: flex; }

  .sheet {
    width: 100%;
    max-width: 430px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-bottom: none;
    border-radius: 30px 30px 0 0;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
    padding: 30px 26px 38px;
    animation: sheet-rise 0.4s var(--ease-out);
  }
  @keyframes sheet-rise {
    from { transform: translateY(48px); opacity: 0; }
    to   { transform: none; opacity: 1; }
  }

  .sheet h3 { font-size: 19px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 26px; }

  .field-label {
    display: block;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 500;
    margin: 0 0 10px 2px;
  }

  .text-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 15px 18px;
    color: var(--text);
    font-size: 16px;
    font-family: inherit;
    font-weight: 400;
    outline: none;
    margin-bottom: 24px;
    transition: border-color 0.25s;
  }
  .text-input:focus { border-color: var(--accent); }
  .text-input::placeholder { color: var(--faint); }

  .icon-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 10px;
    margin-bottom: 28px;
  }
  .icon-opt {
    aspect-ratio: 1;
    border-radius: 14px;
    background: var(--bg);
    border: 1.5px solid var(--line);
    color: var(--muted);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.2s, color 0.2s, background 0.2s, transform 0.15s;
  }
  .icon-opt:active { transform: scale(0.92); }
  .icon-opt.selected {
    border-color: var(--accent);
    background: var(--accent-dim);
    color: var(--accent);
  }

  .sheet-actions { display: flex; gap: 12px; }

  .btn {
    flex: 1;
    border-radius: 999px;
    padding: 15px;
    font-size: 15.5px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    border: none;
    transition: filter 0.2s, transform 0.15s;
  }
  .btn:hover { filter: brightness(1.1); }
  .btn:active { transform: scale(0.97); }
  .btn-primary {
    background: var(--accent);
    color: var(--on-accent);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.22);
  }
  .btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
  .btn-danger {
    flex: 0 0 auto;
    width: 52px;
    display: flex; align-items: center; justify-content: center;
    background: transparent;
    border: 1px solid rgba(192,85,85,0.35);
    color: var(--danger);
  }
  .btn-danger:hover { background: rgba(192,85,85,0.1); }
</style>
</head>
<body>

<div class="phone">
  <div class="glow"></div>

  <header>
    <div class="top-row">
      <div class="avatar" id="avatarIcon"></div>
      <div class="streak-chip" id="streakChip"><b id="globalStreak">0</b>&nbsp;day streak</div>
    </div>
    <h1 id="greeting">Good <strong>morning</strong></h1>
    <p class="date-line" id="dateLine"></p>
  </header>

  <div class="stats">
    <div class="ring">
      <svg width="84" height="84" viewBox="0 0 84 84">
        <circle class="track" cx="42" cy="42" r="36" fill="none" stroke-width="5"/>
        <circle class="fill" id="ringFill" cx="42" cy="42" r="36" fill="none" stroke-width="5"
                stroke-dasharray="226.2" stroke-dashoffset="226.2"/>
      </svg>
      <div class="pct" id="ringPct">0%</div>
    </div>
    <div class="stat-cols">
      <div class="stat">
        <div class="num" id="statDone">0<em>/0</em></div>
        <div class="lbl">Done today</div>
      </div>
      <div class="stat">
        <div class="num" id="statBest">0d</div>
        <div class="lbl">Best streak</div>
      </div>
      <div class="stat wide">
        <div class="num" id="statScore">0%</div>
        <div class="lbl">Repetitive score &middot; 7 days</div>
      </div>
    </div>
  </div>

  <div class="complete-banner" id="completeBanner">
    <div class="complete-icon" id="completeIcon"></div>
    <div>
      <h4>Ritual complete</h4>
      <p id="completeSub"></p>
    </div>
  </div>

  <div class="section-row">
    <h2>Activities</h2>
    <span class="count" id="countLabel"></span>
  </div>

  <div id="list" class="list animate-in"></div>

  <button class="cta" id="addBtn"><span id="ctaIcon"></span>Add activity</button>
</div>

<!-- Add / Edit sheet -->
<div class="overlay" id="overlay">
  <div class="sheet">
    <h3 id="sheetTitle">New activity</h3>

    <label class="field-label" for="nameInput">Name</label>
    <input class="text-input" id="nameInput" placeholder="e.g. Meditate 10 minutes" maxlength="60" autocomplete="off">

    <label class="field-label">Icon</label>
    <div class="icon-grid" id="iconGrid"></div>

    <div class="sheet-actions">
      <button class="btn btn-danger" id="deleteBtn" title="Delete activity"></button>
      <button class="btn btn-ghost" id="cancelBtn">Cancel</button>
      <button class="btn btn-primary" id="saveBtn">Save</button>
    </div>
  </div>
</div>

<script>
(() => {
  const STORAGE_KEY = 'morning-ritual-v2';
  const LEGACY_KEY = 'morning-ritual-v1';

  /* ---------- Icon set (stroke 1.5, currentColor) ---------- */
  const svg = (paths, size = 20) =>
    `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${paths}</svg>`;

  const ICONS = {
    droplet:    svg('<path d="M12 3.5c3.2 3.9 6 7 6 10a6 6 0 1 1-12 0c0-3 2.8-6.1 6-10z"/>'),
    lotus:      svg('<path d="M12 20c-2.8 0-5-2.6-5-6 0-2.8 2-5.6 5-8 3 2.4 5 5.2 5 8 0 3.4-2.2 6-5 6z"/><path d="M7 14c-2 0-3.5-1.4-4-3.5C5 10 6.4 10.4 7.5 11.4"/><path d="M17 14c2 0 3.5-1.4 4-3.5-2-.5-3.4-.1-4.5.9"/>'),
    book:       svg('<path d="M12 6.5C10.5 5 8.5 4.5 4 4.5v14c4.5 0 6.5.5 8 2 1.5-1.5 3.5-2 8-2v-14c-4.5 0-6.5.5-8 2z"/><path d="M12 6.5v14"/>'),
    sun:        svg('<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/>'),
    pencil:     svg('<path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19l-4 1z"/><path d="M14.5 6.5l3 3"/>'),
    dumbbell:   svg('<path d="M7 8v8M4.5 10v4M17 8v8M19.5 10v4M7 12h10"/>'),
    cup:        svg('<path d="M5 10h12v4a6 6 0 0 1-12 0v-4z"/><path d="M17 11h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M8.5 3.5c0 1-1 1.5-1 2.5M12.5 3.5c0 1-1 1.5-1 2.5"/>'),
    bed:        svg('<path d="M3 7v11M3 15h18v3M3 12h18v-1a3 3 0 0 0-3-3H9"/><circle cx="6.5" cy="9.5" r="1.5"/>'),
    shower:     svg('<path d="M5 8a7 7 0 0 1 14 0"/><path d="M12 1v2M8 12v1.5M12 12v1.5M16 12v1.5M6.5 16v1.5M10.2 16v1.5M13.8 16v1.5M17.5 16v1.5"/>'),
    headphones: svg('<path d="M4 14a8 8 0 0 1 16 0"/><rect x="3" y="14" width="4" height="6" rx="2"/><rect x="17" y="14" width="4" height="6" rx="2"/>'),
    pill:       svg('<rect x="3.5" y="8.5" width="17" height="7" rx="3.5" transform="rotate(-35 12 12)"/><path d="M9 9.8l5.5 4"/>'),
    leaf:       svg('<path d="M19 4c-9 0-14 4-14 10a6 6 0 0 0 6 6c6 0 8-8 8-16z"/><path d="M5 20c3-6 7-9 11-11"/>'),
  };
  const ICON_KEYS = Object.keys(ICONS);

  const UI = {
    flame: svg('<path d="M12 21c-3.6 0-6-2.4-6-5.6 0-2.5 1.7-4.3 3-6 .4 1 .6 1.6 1.5 2.4C10.6 8.6 11 5.6 13.5 3c.4 2.6 1.6 4 2.9 5.7 1 1.4 1.6 2.9 1.6 4.7 0 3.2-2.4 5.6-6 5.6z"/>', 15),
    flameSm: svg('<path d="M12 21c-3.6 0-6-2.4-6-5.6 0-2.5 1.7-4.3 3-6 .4 1 .6 1.6 1.5 2.4C10.6 8.6 11 5.6 13.5 3c.4 2.6 1.6 4 2.9 5.7 1 1.4 1.6 2.9 1.6 4.7 0 3.2-2.4 5.6-6 5.6z"/>', 12),
    check: svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>', 19),
    plus:  svg('<path d="M12 5v14M5 12h14"/>', 17),
    edit:  svg('<path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19l-4 1z"/><path d="M14.5 6.5l3 3"/>', 15),
    trash: svg('<path d="M4.5 6.5h15M9.5 6.5v-2a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v2M7 6.5l.8 12a2 2 0 0 0 2 1.9h4.4a2 2 0 0 0 2-1.9l.8-12"/><path d="M10 10.5v5M14 10.5v5"/>', 17),
    moon:  svg('<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/>', 21),
    sun:   svg('<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/>', 21),
    sparkle: svg('<path d="M12 4l1.8 5.2L19 11l-5.2 1.8L12 18l-1.8-5.2L5 11l5.2-1.8L12 4z"/><path d="M18.5 3.5v3M17 5h3"/>', 22),
    checkSm: svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>', 15),
  };

  /* ---------- Dates ---------- */
  const todayKey = (d = new Date()) => {
    const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  };
  const daysAgoKey = n => { const d = new Date(); d.setDate(d.getDate() - n); return todayKey(d); };

  /* ---------- State ---------- */
  const EMOJI_MAP = { '🧘':'lotus','💧':'droplet','🏃':'dumbbell','📖':'book','☀️':'sun','✍️':'pencil','🥣':'cup','🛏️':'bed','🚿':'shower','🎧':'headphones','💊':'pill','🌿':'leaf' };

  let state = load();

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
      const legacy = localStorage.getItem(LEGACY_KEY);
      if (legacy) {
        const old = JSON.parse(legacy);
        const migrated = {
          activities: (old.activities || []).map(a => ({
            id: a.id, name: a.name,
            icon: EMOJI_MAP[a.emoji] || 'sun',
            history: a.history || {}
          }))
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
        return migrated;
      }
    } catch (e) {}
    return {
      activities: [
        { id: crypto.randomUUID(), icon: 'droplet', name: 'Drink a glass of water', history: {} },
        { id: crypto.randomUUID(), icon: 'lotus',   name: 'Meditate 10 minutes',   history: {} },
        { id: crypto.randomUUID(), icon: 'book',    name: 'Read 5 pages',          history: {} },
      ]
    };
  }
  const save = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

  /* ---------- Scores ---------- */
  function activityStreak(a) {
    let streak = 0;
    const offset = a.history[todayKey()] ? 0 : 1;  // an unfinished today doesn't break the streak
    for (let i = offset; ; i++) {
      if (a.history[daysAgoKey(i)]) streak++;
      else break;
    }
    return streak;
  }

  function globalStreak() {
    if (!state.activities.length) return 0;
    const allDone = k => state.activities.every(a => a.history[k]);
    let streak = 0;
    const offset = allDone(todayKey()) ? 0 : 1;
    for (let i = offset; ; i++) {
      if (allDone(daysAgoKey(i))) streak++;
      else break;
    }
    return streak;
  }

  function bestStreak() {
    return Math.max(0, ...state.activities.map(activityStreak));
  }

  function repetitiveScore() {
    if (!state.activities.length) return 0;
    let hits = 0;
    for (let i = 0; i < 7; i++) {
      const k = daysAgoKey(i);
      hits += state.activities.filter(a => a.history[k]).length;
    }
    return Math.round(100 * hits / (7 * state.activities.length));
  }

  /* ---------- Render ---------- */
  const $ = id => document.getElementById(id);
  let firstRender = true;

  $('avatarIcon').innerHTML = UI.moon;
  $('ctaIcon').innerHTML = UI.plus;
  $('deleteBtn').innerHTML = UI.trash;
  $('completeIcon').innerHTML = UI.sparkle;
  $('streakChip').insertAdjacentHTML('afterbegin', UI.flame);

  function render() {
    const now = new Date();
    const h = now.getHours();
    $('greeting').innerHTML = h < 12 ? 'Good <strong>morning</strong>' : h < 18 ? 'Good <strong>afternoon</strong>' : 'Good <strong>evening</strong>';
    $('avatarIcon').innerHTML = h < 12 ? UI.sun : UI.moon;
    $('dateLine').textContent = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

    const total = state.activities.length;
    const done = state.activities.filter(a => a.history[todayKey()]).length;
    const pct = total ? Math.round(100 * done / total) : 0;

    const complete = total > 0 && done === total;
    const pctEl = $('ringPct');
    pctEl.classList.toggle('full', complete);
    pctEl.innerHTML = complete ? UI.check : pct + '%';
    $('ringFill').style.strokeDashoffset = (226.2 * (1 - pct / 100)).toFixed(1);

    $('completeBanner').classList.toggle('show', complete);
    if (complete) {
      const gs = globalStreak();
      $('completeSub').innerHTML =
        `All ${total} activities done this morning. ` +
        (gs > 1 ? `That's a <b>${gs}-day streak</b> — see you tomorrow.` : `Come back tomorrow to start a <b>streak</b>.`);
    }
    $('statDone').innerHTML = `${done}<em>/${total}</em>`;
    $('statBest').textContent = bestStreak() + 'd';
    $('statScore').textContent = repetitiveScore() + '%';
    $('globalStreak').textContent = globalStreak();
    $('countLabel').textContent = total ? `${done} of ${total} done` : '';

    const list = $('list');
    list.classList.toggle('animate-in', firstRender);
    list.innerHTML = '';

    if (!total) {
      list.innerHTML = `
        <div class="empty">
          <div class="empty-icon">${ICONS.sun}</div>
          <h4>Nothing here yet</h4>
          <p>Add the first activity of your morning ritual and start building a streak.</p>
        </div>`;
      firstRender = false;
      return;
    }

    state.activities.forEach((a, idx) => {
      const isDone = !!a.history[todayKey()];
      const streak = activityStreak(a);

      let dotsHtml = '';
      for (let i = 6; i >= 0; i--) {
        const k = daysAgoKey(i);
        dotsHtml += `<span class="dot ${a.history[k] ? 'hit' : ''} ${i === 0 ? 'today-dot' : ''}"></span>`;
      }

      const row = document.createElement('div');
      row.className = 'activity' + (isDone ? ' done' : '');
      row.style.setProperty('--i', idx);
      row.innerHTML = `
        <div class="act-icon">${ICONS[a.icon] || ICONS.sun}</div>
        <div class="act-body">
          <div class="act-name">${escapeHtml(a.name)}</div>
          <div class="act-meta">
            <span class="streak-tag ${streak ? '' : 'zero'}">${UI.flameSm} ${streak}d</span>
            <span class="dots">${dotsHtml}</span>
          </div>
        </div>
        <div class="act-actions">
          <button class="icon-btn" data-edit="${a.id}" title="Edit">${UI.edit}</button>
          <button class="check-btn" data-check="${a.id}" title="Mark done">${UI.check}</button>
        </div>`;
      list.appendChild(row);
    });

    firstRender = false;
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  /* ---------- Interactions ---------- */
  const isAllDone = () => state.activities.length > 0 && state.activities.every(a => a.history[todayKey()]);

  function burst() {
    const phone = document.querySelector('.phone');
    const icon = $('completeIcon');
    const pr = phone.getBoundingClientRect();
    const ir = icon.getBoundingClientRect();
    const cx = ir.left - pr.left + ir.width / 2;
    const cy = ir.top - pr.top + ir.height / 2;
    for (let i = 0; i < 14; i++) {
      const s = document.createElement('span');
      s.className = 'spark';
      const ang = (Math.PI * 2 * i) / 14 + (Math.random() - 0.5) * 0.5;
      const dist = 44 + Math.random() * 46;
      s.style.left = cx + 'px';
      s.style.top = cy + 'px';
      s.style.setProperty('--dx', (Math.cos(ang) * dist).toFixed(0) + 'px');
      s.style.setProperty('--dy', (Math.sin(ang) * dist).toFixed(0) + 'px');
      phone.appendChild(s);
      setTimeout(() => s.remove(), 850);
    }
  }

  document.addEventListener('click', e => {
    const checkId = e.target.closest('[data-check]')?.dataset.check;
    if (checkId) {
      const a = state.activities.find(x => x.id === checkId);
      const k = todayKey();
      const wasComplete = isAllDone();
      if (a.history[k]) delete a.history[k]; else a.history[k] = true;
      save(); render();
      if (isAllDone() && !wasComplete) burst();
      return;
    }
    const editId = e.target.closest('[data-edit]')?.dataset.edit;
    if (editId) openSheet(editId);
  });

  /* ---------- Sheet (add/edit) ---------- */
  let editingId = null;
  let selectedIcon = ICON_KEYS[0];

  function buildIconGrid() {
    $('iconGrid').innerHTML = ICON_KEYS.map(key =>
      `<button class="icon-opt ${key === selectedIcon ? 'selected' : ''}" data-icon="${key}" title="${key}">${ICONS[key]}</button>`
    ).join('');
  }

  $('iconGrid').addEventListener('click', e => {
    const key = e.target.closest('[data-icon]')?.dataset.icon;
    if (!key) return;
    selectedIcon = key;
    buildIconGrid();
  });

  function openSheet(id = null) {
    editingId = id;
    const a = id ? state.activities.find(x => x.id === id) : null;
    $('sheetTitle').textContent = a ? 'Edit activity' : 'New activity';
    $('nameInput').value = a ? a.name : '';
    selectedIcon = a ? a.icon : ICON_KEYS[0];
    $('deleteBtn').style.display = a ? '' : 'none';
    buildIconGrid();
    $('overlay').classList.add('open');
    setTimeout(() => $('nameInput').focus(), 60);
  }

  const closeSheet = () => $('overlay').classList.remove('open');

  $('addBtn').addEventListener('click', () => openSheet());
  $('cancelBtn').addEventListener('click', closeSheet);
  $('overlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeSheet(); });

  $('saveBtn').addEventListener('click', () => {
    const name = $('nameInput').value.trim();
    if (!name) { $('nameInput').focus(); return; }
    if (editingId) {
      const a = state.activities.find(x => x.id === editingId);
      a.name = name;
      a.icon = selectedIcon;
    } else {
      state.activities.push({ id: crypto.randomUUID(), name, icon: selectedIcon, history: {} });
    }
    save(); closeSheet(); render();
  });

  $('deleteBtn').addEventListener('click', () => {
    if (!editingId) return;
    if (!confirm('Delete this activity and its history?')) return;
    state.activities = state.activities.filter(x => x.id !== editingId);
    save(); closeSheet(); render();
  });

  $('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('saveBtn').click(); });

  render();
})();
</script>
</body>
</html>
